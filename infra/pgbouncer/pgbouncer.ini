; ============================================================
; CampusOS PgBouncer Configuration — Cycle 31 Step 6
; ============================================================
; Schema-per-tenant connection pooling per ADR-001/050.
;
; Mode: transaction-level pooling. On every transaction the server
; connection is checked out from the pool with an empty session
; state and the application sets `search_path` immediately.
;
; This config is the deployment-time template. Production replaces
; the connection strings with secrets-manager references.
;
; Reference: PgBouncer 1.21+ documentation.
; ============================================================

[databases]

; Tenant-aware databases. The application connects to one of these
; aliases — PgBouncer routes to the underlying PostgreSQL with
; per-database pool settings.

campusos_app = host=postgres-primary.internal port=5432 dbname=campusos pool_size=20

; Read replica for the platform schema (Prisma queries that don't
; need transactional consistency). PrismaClient uses a separate
; connection string for these.
campusos_read = host=postgres-replica.internal port=5432 dbname=campusos pool_size=10

; Long-running analytics queries — separate pool so they don't
; starve the app pool.
campusos_analytics = host=postgres-replica.internal port=5432 dbname=campusos pool_size=5 pool_mode=session


[pgbouncer]

listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction

; Default pool size per (db, user) pair when not overridden above.
default_pool_size = 20

; Reserve pool — extra connections opened when the main pool is
; exhausted. Caps total connections per backend.
reserve_pool_size = 5
reserve_pool_timeout = 3

; Max client connections accepted by PgBouncer (across all pools).
max_client_conn = 1000

; Per-database limits — prevents noisy-neighbor exhaustion. A single
; tenant can't drink the entire pool.
max_db_connections = 50
max_user_connections = 25

; Server connection idle timeout — return idle connections to the
; backend after 5 minutes.
server_idle_timeout = 300

; Query timeout — kill any single query running longer than 30 minutes
; (the analytics workers run shorter than this; longer scans should
; use the analytics pool with session pooling instead).
query_timeout = 1800

; Server reset query — runs on every connection checkout to scrub
; session state. The application is then responsible for setting
; search_path on its own (via TenantPrismaService.executeInTenantContext)
; because PgBouncer does not know which tenant the next checkout
; should serve.
server_reset_query = DISCARD ALL

; Application-name passthrough so pg_stat_activity shows the request
; trace_id (set by PrismaClient via application_name parameter).
application_name_add_host = 1

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; Stats endpoint for Prometheus scraper.
stats_period = 60

admin_users = pgbouncer_admin
stats_users = prometheus_scraper
